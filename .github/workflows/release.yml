name: release

# Only a pushed version tag builds a release, and only as a draft.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write      # build provenance (attest-build-provenance)
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # A release is cut from main only.
      - name: The tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "release: $GITHUB_REF_NAME is not on main" >&2; exit 1; }
      - run: make check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.3   # the same as make release-snapshot
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signed provenance for every archive, checkable with
      # `gh attestation verify <archive> -R straum-io/straum-console`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
